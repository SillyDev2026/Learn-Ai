<main>

  <!-- CHAT PANEL -->
  <section class="panel chat-panel">
    <h2>Chat</h2>
    <div id="chatLog" class="chat-log"></div>

    <div class="chat-input-row">
      <input id="chatInput" placeholder="Say something..." />
      <button id="chatSend" class="primary">Send</button>
    </div>
  </section>

  <!-- TRAINING PANEL -->
  <section class="panel train-panel">
    <h2>Training</h2>

    <textarea id="trainInput" placeholder="User message..."></textarea>
    <textarea id="trainOutput" placeholder="Correct assistant reply..."></textarea>

    <button id="trainSubmit" class="warning">Teach Model</button>
  </section>

  <!-- RAW MODEL INPUT PANEL -->
  <section class="panel input-panel">
    <h2>Raw Model Input</h2>
    <textarea id="input" placeholder="Direct prompt to /predict"></textarea>
    <button id="submit" class="secondary">Run Raw Prediction</button>
  </section>

  <!-- STATUS PANEL -->
  <section class="panel status-panel">
    <h2>System Status</h2>
    <button id="refreshStatus" class="secondary">Refresh</button>
    <pre id="statusBox">Loading...</pre>
  </section>

</main>
